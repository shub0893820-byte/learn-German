name: Publish daily German lesson
on:
  schedule:
    - cron: '30 6,7 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate today's lesson
        run: python scripts/publish_lesson.py
      - name: Commit lesson archive if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lessons.json
          git diff --cached --quiet || (git commit -m "Publish daily German flashcards" && git push)
